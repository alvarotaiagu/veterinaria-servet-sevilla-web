<script>
/* Bloqueante a propósito: todo lo que cambia el aspecto se resuelve antes del
   primer pintado, o la página arranca de una forma y salta a otra.
   Lo que va entre las marcas del mando lo borra scripts/quitar_mandos.py. */
(function () {
  var h = document.documentElement;
  h.classList.remove('sin-js');
  h.classList.add('con-js');
})();
</script>
